version: '3.8'

services:
  app:
    container_name: nextjs-dashboard
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/nextjs-dashboard
      - JWT_SECRET=production-secret-key-change-this
    depends_on:
      - mongo
    networks:
      - app-network

  mongo:
    container_name: mongodb
    image: mongo:latest
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
